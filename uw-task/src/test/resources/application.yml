# uw-task 集成测试配置：扮演"业务方应用"，连真实 RabbitMQ + Redis + task-center。
# 前提：192.168.88.21 的 RabbitMQ(5672)/Redis(6380) 可达，且 task-center（默认 http://uw-task-center）可达——
# listener container 由 task-center 下发的 runner 配置驱动启动，task-center 不可达则 sendToQueue 的消息不会被消费。
spring:
  application:
    name: uw-task-test
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.88.21:8848
        ip: 127.0.0.1
        register-enabled: false  # 只发现 auth-center/task-center 服务，不注册自己

server:
  port: 0

project:
  version: 1.0.0-test

uw:
  task:
    enable-registry: true
    task-project: uw.task
    run-target: default
    croner-thread-num: 5
    # task-center 地址。默认 http://uw-task-center，你的环境需能解析该域名（内网 DNS / hosts）。
    # 若 task-center 部署在别处，改成实际地址（如 http://192.168.88.21:8080）。
    task-center-host: http://uw-task-center
    rabbitmq:
      host: 192.168.88.21
      port: 5672
      username: rabbit
      password: 23Dl4uLzlJZVnIlbiyMd7AcR7kzrL4DG
      # publisher-confirm-type: correlated  # 测试：关掉 confirm，验证 RPC/sendToQueue 是否依赖它
      virtual-host: /
      ssl:
        enabled: false
    redis:
      database: 7
      host: 192.168.88.21
      port: 6380
      username: ${REDIS_USERNAME:}
      password: Ah8mm6tgE0vSv2aadIELqdHAAohgbFYl
      lettuce:
        pool:
          max-active: 200
          max-idle: 8
          max-wait: 10s
          min-idle: 1
      timeout: 30s
      ssl:
        enabled: false

auth:
  client:
    login-id: rpc
    login-pass: JhFiROEPUJkbt9x92TL3IldDwPqRtuHg

log:
  es:
    server: http://192.168.88.21:9200
    username: elastic
    password: Few20Dk1zuSVZcdzxhOYMG1kp95XVzPj

logging:
  level:
    uw.task: INFO
    org.springframework.amqp: WARN
