# 连 dev（10.0.0.10）；密码经环境变量注入（UW_TEST_REDIS_PASSWORD / UW_TEST_MYSQL_PASSWORD），勿提交明文。
uw:
  dao:
    conn-pool:
      root:
        driver: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://10.0.0.10:3308/uw_auth
        username: uw
        password: ${UW_TEST_MYSQL_PASSWORD}
        min-conn: 3
        max-conn: 100
        conn-idle-timeout: 180
        conn-busy-timeout: 180
        conn-max-age: 600
    redis:
      database: 5
      host: 10.0.0.10
      port: 6380
      password: ${UW_TEST_REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 200
          max-idle: 8
          max-wait: 10s
          min-idle: 1
      timeout: 30s
      ssl:
        enabled: false
logging:
  level:
    uw.dao: warn
